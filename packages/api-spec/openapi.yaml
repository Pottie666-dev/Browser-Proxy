openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: BrowserVault API - account management and proxy browsing
servers:
- url: /api
  description: Base API path
tags:
- name: health
  description: Health operations
- name: accounts
  description: Account management
- name: proxy
  description: Web proxy
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
      - health
      summary: Health check
      description: Returns server health status
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
      security: []
  /accounts:
    get:
      operationId: listAccounts
      tags:
      - accounts
      summary: List all accounts
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
    post:
      operationId: createAccount
      tags:
      - accounts
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '201':
          description: Created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /accounts/{id}:
    get:
      operationId: getAccount
      tags:
      - accounts
      summary: Get account by ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateAccount
      tags:
      - accounts
      summary: Update an account
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteAccount
      tags:
      - accounts
      summary: Delete an account
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      operationId: loginUser
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /auth/register:
    post:
      operationId: registerUser
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /auth/refresh:
    post:
      operationId: refreshSession
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
  /auth/me:
    get:
      operationId: currentUser
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
  /auth/logout:
    post:
      operationId: logoutUser
      responses:
        '204':
          description: Session revoked
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Account:
      type: object
      required:
      - id
      - name
      - deviceName
      - userAgent
      - fakeIp
      - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        surname:
          type: string
        email:
          type: string
        password:
          type: string
        walletName:
          type: string
        deviceName:
          type: string
        userAgent:
          type: string
        fakeIp:
          type: string
        username:
          type:
          - string
          - 'null'
        idNumber:
          type:
          - string
          - 'null'
        cryptoAddress:
          type:
          - string
          - 'null'
        image1:
          type:
          - string
          - 'null'
          description: Base64 data URI of first stored image
        image2:
          type:
          - string
          - 'null'
          description: Base64 data URI of second stored image
        createdAt:
          type: string
        favorite:
          type: boolean
        tags:
          type: array
          items:
            type: string
        notes:
          type:
          - string
          - 'null'
        timezone:
          type:
          - string
          - 'null'
        proxyId:
          type:
          - string
          - 'null'
        fingerprint:
          type: object
          additionalProperties: true
    AccountInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        surname:
          type: string
          minLength: 1
        email:
          type:
          - string
          - 'null'
          description: If omitted, a random email is generated from name and surname
        password:
          type: string
          minLength: 1
        walletName:
          type: string
          minLength: 1
        username:
          type:
          - string
          - 'null'
        idNumber:
          type:
          - string
          - 'null'
        cryptoAddress:
          type:
          - string
          - 'null'
        image1:
          type:
          - string
          - 'null'
        image2:
          type:
          - string
          - 'null'
        favorite:
          type: boolean
        tags:
          type: array
          items:
            type: string
        notes:
          type:
          - string
          - 'null'
        timezone:
          type:
          - string
          - 'null'
        proxyId:
          type:
          - string
          - 'null'
        fingerprint:
          type: object
          additionalProperties: true
    AccountUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        surname:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        walletName:
          type: string
          minLength: 1
        username:
          type:
          - string
          - 'null'
        idNumber:
          type:
          - string
          - 'null'
        cryptoAddress:
          type:
          - string
          - 'null'
        image1:
          type:
          - string
          - 'null'
        image2:
          type:
          - string
          - 'null'
        favorite:
          type: boolean
        tags:
          type: array
          items:
            type: string
        notes:
          type:
          - string
          - 'null'
        timezone:
          type:
          - string
          - 'null'
        proxyId:
          type:
          - string
          - 'null'
        fingerprint:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    LoginInput:
      type: object
      required:
      - email
      - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
    AuthSession:
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresAt
      - userId
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
        userId:
          type: string
    RefreshInput:
      type: object
      required:
      - refreshToken
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
    AuthUser:
      type: object
      required:
      - id
      properties:
        id:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque short-lived access token; refresh tokens rotate and are
        revocable.
security:
- bearerAuth: []
