name: Android hardware readiness
on:
  push:
    branches: [development/stage-4-2-hardware-readiness]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-hardware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned workspace
        run: |
          npm install --global pnpm@10.28.2
          pnpm install --frozen-lockfile --strict-peer-dependencies
          pnpm run codegen
          pnpm run typecheck
          node --test scripts/test/*.test.mjs
      - name: Prepare official Android SDK
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          CI=true EXPO_NO_TELEMETRY=1 pnpm run mobile:prebuild
      - name: Build standalone controller and Companion
        run: |
          ./apps/mobile/android/gradlew -p apps/mobile/android :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --max-workers=2 --no-daemon
          export BROWSER_PROXY_DEV_KEYSTORE="$GITHUB_WORKSPACE/apps/mobile/android/app/debug.keystore"
          ./apps/android-companion/gradlew -p apps/android-companion :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --max-workers=2 --no-daemon
          mkdir -p hardware-artifacts
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk hardware-artifacts/BrowserProxy-controller-hardware.apk
          cp apps/android-companion/app/build/outputs/apk/debug/app-debug.apk hardware-artifacts/BrowserProxy-companion-hardware.apk
          node scripts/android-build-provenance.mjs hardware-artifacts
          cp docs/STAGE_4_2_HARDWARE_READINESS.md hardware-artifacts/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-proxy-android-${{ github.sha }}
          path: hardware-artifacts/
          if-no-files-found: error
          retention-days: 30
